theme = "base16_transparent"

[editor]
line-number = "absolute"
mouse = true
scrolloff = 3
middle-click-paste = true
scroll-lines = 3
shell = ["bash", "-c"]
gutters = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]
auto-completion = true
auto-format = true
idle-timeout = 400
completion-trigger-len = 1
completion-replace = true
auto-info = true
true-color = true
rulers = [80, 88, 120]
auto-pairs = true
cursorline = true
bufferline = "always"
color-modes = true
popup-border = "all"
end-of-line-diagnostics = "hint"

# [editor.gutters.line-numbers]
# min-width = 3

[editor.statusline]
left = [
  "mode",
  "spinner",
  "file-name",
  "file-type",
  "file-encoding",
  "file-line-ending",
  "file-modification-indicator",
  "version-control",
]
center = []
right = [
  "diagnostics",
  "workspace-diagnostics",
  "selections",
  "primary-selection-length",
  "position",
  "total-line-numbers",
]
separator = "|"


[editor.lsp]
enable = true
display-messages = true
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true
max-depth = 7

[editor.search]
smart-case = true
wrap-around = true

[editor.whitespace.render]
space = "none"
tab = "all"
newline = "all"
nbsp = "all"
nnbsp = "all"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·"  # Tabs will look like "→···" (depending on tab width)

[editor.indent-guides]
render = true
character = "▏"

[editor.soft-wrap]
enable = true

[keys.normal]
# Git UIs
A-g = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
A-S-g = [":new", ":insert-output gitui", ":buffer-close!", ":redraw"]

