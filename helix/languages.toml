# Language servers config
[language-server]
biome = { command = "biome", args = ["lsp-proxy"] }
nu-lsp = { command = "nu", args = ["--lsp"] }
taplo = { command = "taplo", args = ["lsp", "stdio"] }
termux-language-server = { command = "termux-language-server" }

[language-server.pyright.config.python.analysis]
typeCheckingMode = "basic"

[language-server.typescript-language-server.config.preferences]
importModuleSpecifier = "non-relative"

[language-server.ruff]
command = "ruff-lsp"

[language-server.ruff.config.settings]
args = ["--ignore", "E501"]

[language-server.eslint]
# command = "vscode-eslint-language-server"
command = "eslint"
args = ["--stdio"]

# Configuration reference: https://github.com/microsoft/vscode-eslint?tab=readme-ov-file#settings-options
[language-server.eslint.config]
validate = "on"
run = "onType"
workingDirectory.mode = "location"
experimental = { useFlatConfig = true }
format.enable = false
nodePath = ""

# Rules/actions/reporting configuration
rulesCustomizations = [{ rule = "*", severity = "warn" }]
codeActionOnSave.enable = false
codeAction.disableRuleComment = { enable = true, location = "separateLine" }
codeAction.showDocumentation.enable = true
problems = { shortenToSingleLine = true }

[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
max_completion_items = 20    # set max completion results len for each group: words, snippets, unicode-input
snippets_first = true        # completions will return before snippets by default
feature_words = true         # enable completion by word
feature_snippets = true      # enable snippets
feature_unicode_input = true # enable "unicode input"
feature_paths = true         # enable path completion

# write logs to /tmp/completion.log
[language-server.scls.environment]
RUST_LOG = "info,simple-completion-langauge-server=info"
LOG_FILE = "/tmp/completion.log"

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]

[language-server.deno-lsp.config.deno]
enable = true
unstable = true
suggest.imports.hosts = { "https://deno.land" = true }
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.enumMemberValues.enabled = true

[[language]]
name = "rust"
formatter = { command = "rustfmt" }
auto-format = true
language-servers = ["scls", "rust-analyzer"]

