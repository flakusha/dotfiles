# ENV
# XDG stuff
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# X11 / Wayland fallbacks
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland

env = CLUTTER_BACKEND,wayland
env = OZONE_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,0.75

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,kvantum

# This should work
env = XCURSOR_PATH,/usr/share/icons
env = XCURSOR_THEME,catppuccin-mocha-teal-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-mocha-teal-cursors
env = HYPRCURSOR_SIZE,24
exec-once = hyprctl setcursor catppuccin-mocha-teal-cursors $HYPRCURSOR_SIZE

# Language support
# env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = IMSETTINGS_MODULE,fcitx
env = IMSETTINGS_INTEGRATE_DESKTOP,yes

# Fancy WINE filesystem synchronisation
# env = WINEESYNC,1
env = WINEFSYNC,1

# WLR
# env = WLR_RENDERER_ALLOW_SOFTWARE,1
# env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER,vulkan

# Personal preference
env = EDITOR,hx
env = LC_LOCALE,en_IE.UTF-8
env = RUSTICL_ENABLE,radeonsi
env = STEAM_FORCE_DESKTOPUI_SCALING,0.5

# Dbus update
# Globals
# monitor = ,preferred,auto, 1
# wsbind = 1,eDP-1
# monitor = DP-1,3840x2160@144.00,0x0,1
monitor = , preferred, auto, 1, bitdepth, 8

exec = echo 'Hyprland config executing'

# exec-once = /usr/bin/dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/bin/dbus-update-activation-environment --all
exec-once = xrdb -merge ~/.Xresources
# exec = env | sort

# exec-once = /usr/libexec/xdg-desktop-portal-hyprland
exec-once = /usr/libexec/xdg-desktop-portal-gtk
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = /usr/libexec/xdg-desktop-portal
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec-once = /usr/libexec/pam_kwallet_init

# Autostart
exec-once = $HOME/.config/hypr/autostart
exec-once = $HOME/.config/hypr/scripts/launch_waybar

# Sound
exec-once = /usr/bin/pipewire

# Languages
exec-once = LD_LIBRARY_PATH=/usr/lib64 fcitx5 -dr --enable all
exec-once = LD_LIBRARY_PATH=/usr/lib64 /usr/libexec/fcitx5-wayland-launcher
# exec-once = LD_LIBRARY_PATH=/usr/lib64 /usr/bin/ibus-daemon -dxr --panel=disable

# Network
exec-once = nm-applet --appindicator

# KDEConnect
exec-once = kdeconnect-indicator

exec = echo 'Hyprland config finished exec-once'

# See https://wiki.hyprland.org/Configuring/Variables/ for more
general {
    # sensitivity = 1.0 # for mouse cursor
    border_size = 2
    no_border_on_floating = 0
    gaps_in = 1
    gaps_out = 0
    col.inactive_border = 0xff45475a
    col.active_border = 0xfff5c2e7
    # col.non_group_border = 0xffffaaff
    layout = dwindle # master # available: dwindle master
    no_focus_fallback = 0
    # apply_sens_to_raw = 0 # whether to apply the sensitivity to raw input (e.g. used by games where you aim using your mouse)
    resize_on_border = 0
    extend_border_grab_area = 15
    hover_icon_on_border = 1
    allow_tearing = 0
    resize_corner = 0
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # drop_shadow = 0
    # shadow_range = 4
    # shadow_render_power = 3
    # shadow_ignore_window = 1

    # col.shadow = rgba(1a1a1aee)
    # col.shadow = 0x33000000
    # col.shadow_inactive = 0x22000000

    # shadow_offset = 0, 0
    # shadow_scale = 1.0

    dim_inactive = 1
    dim_strength = 0.2
    dim_special = 0.2
    dim_around = 0.4

    # screen_shader = 
    
    blur {
        enabled = false
        size = 8
        passes = 1
        ignore_opacity = 0
        new_optimizations = 1
        xray = 0
        noise = 0.00117
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        special = 0
        popups = 0
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = 1
    first_launch_animation = 1

    # bezier = overshot,0.05,0.9,0.1,1.1 # Version 1
    # bezier = overshot,0.13,0.99,0.29,1.09 # Version 2
    bezier = overshot,0,0.61,0.22,1.12 #Current active
    animation = windows,1,3.8,default,slide 
    animation = border,1,4,default
    animation = fade,1,4,default
    animation = workspaces,1,3.8,overshot,slidevert
}

input {
    sensitivity = 0.1
    # kb_layout = latam,es 
    # kb_variant = ffffff
    # kb_model = 
    # kb_options = 
    # kb_rules = 
    # numlock_by_default = 0
    # repeat_delay = 500
    # repeat_rate = 5

    # follow_mouse = 1

    # touchpad {
        # natural_scroll = no
    # }
}

gestures {
    workspace_swipe = yes
    workspace_swipe_fingers = 4
}

cursor {
    default_monitor = 'DP-1'
    hide_on_key_press = true
    hide_on_touch = true
    enable_hyprcursor = true
    no_hardware_cursors = true
    no_break_fs_vrr = true
    inactive_timeout = 5
    no_warps = false
}

ecosystem {
    no_update_news = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = false
    col.splash = 0xffffffff
    splash_font_family = Sans
    force_default_wallpaper = -1

    vfr = true
    vrr = 2

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    disable_autoreload = false
    enable_swallow = false
    # swallow_regex =
    # swallow_exception_regex =
    focus_on_activate = false
    # no_direct_scanout = true

    # hide_cursor_on_touch = false
    # hide_cursor_on_key_press = true
    mouse_move_focuses_monitor = true

    # suppress_portal_warnings = false
    render_ahead_of_time = false
    render_ahead_safezone = 1

    # cursor_zoom_factor = 1.0
    # cursor_zoom_rigid = false

    allow_session_lock_restore = false
    background_color = 0x111111

    close_special_on_empty = true
    new_window_takes_over_fullscreen = 1
    # enable_hyprcursor = true
}

dwindle {
    pseudotile = 1 # enable pseudotiling on dwindle
    force_split = 2
    preserve_split = 0
    smart_split = 0
    smart_resizing = 1
    permanent_direction_override = 0
    special_scale_factor = 0.8
    split_width_multiplier = 1.0
    # no_gaps_when_only = 1
    use_active_for_splits = 1
    default_split_ratio = 1.0
}

# master {}

xwayland {
    use_nearest_neighbor = 1
    force_zero_scaling = 1
}

render {
    direct_scanout = true
}

debug {
    disable_logs = 1
    disable_time = 1
    enable_stdout_logs = 1
}

experimental {
    # wide_color_gamut = true
    # hdr = true
    # xx_color_management_v4 = true
}

# Window rules #
windowrule = float,Rofi
windowrule = float,system_monitor
windowrule = size 1000 760,system_monitor
windowrule = move 454 192,system_monitor
windowrule = float,calendar
windowrule = size 800 500,calendar
windowrule = move 595 44,calendar
windowrule = opacity 0.99 0.99,Cider
windowrule = opaque,firefox
windowrule = float,pavucontrol
windowrulev2 = float,class:^(org.wezfurlong.wezterm)$
windowrulev2 = tile,class:^(org.wezfurlong.wezterm)$

# System binds #
bindm = SUPER,mouse:272,movewindow
bindm = SUPER,mouse:273,resizewindow

bind = Alt,Print,exec,~/.config/hypr/scripts/screenshot2
bind = ,Print,exec,~/.config/hypr/scripts/screenshot
bind = ,XF86MonBrightnessUp,exec,brightnessctl set 30+
bind = ,XF86MonBrightnessDown,exec,brightnessctl set 30-
bind = ,XF86AudioRaiseVolume,exec,amixer set Master 5%+
bind = ,XF86AudioLowerVolume,exec,amixer set Master 5%-
bind = ,XF86AudioMute,exec,amixer set Master toggle
bind = SUPER,F,fullscreen
bind = SUPER,W,fullscreen,1
bind = SUPER,Q,killactive
bind = SUPER,K,exec,hyprctl kill
bind = SUPERSHIFT,E,exit
bind = SUPER,S,togglefloating
bind = SUPER,P,pseudo
bind = SUPER,L,exec,~/.config/hypr/scripts/lock
bind = SUPER,left,movefocus,l
bind = SUPER,right,movefocus,r
bind = SUPER,up,movefocus,u
bind = SUPER,down,movefocus,d
bind = SUPERSHIFT,left,movewindow,l
bind = SUPERSHIFT,right,movewindow,r
bind = SUPERSHIFT,up,movewindow,u
bind = SUPERSHIFT,down,movewindow,d
bind = SUPER,1,workspace,1
bind = SUPER,2,workspace,2
bind = SUPER,3,workspace,3 
bind = SUPER,4,workspace,4
bind = SUPER,5,workspace,5
bind = SUPER,6,workspace,6
bind = SUPER,7,workspace,7
bind = SUPER,8,workspace,8
bind = SUPER,9,workspace,9
bind = SUPER,0,workspace,10
bind = SUPERSHIFT,1,movetoworkspacesilent,1
bind = SUPERSHIFT,2,movetoworkspacesilent,2
bind = SUPERSHIFT,3,movetoworkspacesilent,3
bind = SUPERSHIFT,4,movetoworkspacesilent,4
bind = SUPERSHIFT,5,movetoworkspacesilent,5
bind = SUPERSHIFT,6,movetoworkspacesilent,6
bind = SUPERSHIFT,7,movetoworkspacesilent,7
bind = SUPERSHIFT,8,movetoworkspacesilent,8
bind = SUPERSHIFT,9,movetoworkspacesilent,9
bind = SUPERSHIFT,0,movetoworkspacesilent,10

# Use {} to work with scratchpad
bind = SUPERSHIFT,code:34,movetoworkspacesilent,special
bind = SUPERSHIFT,code:35,togglespecialworkspace,

bind = SUPER,mouse_down,workspace,e+1
bind = SUPER,mouse_up,workspace,e-1
bind = SUPER,g,togglegroup
bind = SUPER,tab,changegroupactive
bindl = ,switch:Lid Switch,exec,~/.config/hypr/scripts/lock
bindl = ,switch:Lid Switch,exec,systemctl suspend

# Binds to launch programs
bind = SUPER,N,exec,thunar
bind = SUPER,D,exec,rofi -config ~/.config/rofi/config-wayland.rasi -show drun
bind = SUPER,RETURN,exec,wezterm
