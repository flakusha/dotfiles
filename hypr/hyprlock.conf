general {
    disable_loading_bar = false
    hide_cursor = true
}

animations {
    enabled = true
    # bezier = linear, 1, 1, 0, 0
    # animation = fade, 1, 400.0, linear
}

background {
    path = screenshot
    blur_passes = 2
    blur_size = 4
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date --iso-8601=seconds)</big></b>"
    color = $color6
    font_size = 72
    font_family = NotoSansM Nerd Font
    # shadow_passes = 3
    # shadow_size = 4

    position = 0, 100
    halign = center
    valign = center
}

# Info
label {
    monitor =
    text = $USER, screen was locked.<br/>Unlock attempts: $ATTEMPTS[0].
    color = $color6
    font_size = 16
    font_family = NotoSansM Nerd Font
    # shadow_passes = 3
    # shadow_size = 4

    position = 0, -180
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}
