# Language servers config
[language-server]
biome = { command = "biome", args = ["lsp-proxy"] }
nu-lsp = { command = "nu", args = ["--lsp"] }
taplo = { command = "taplo", args = ["lsp", "stdio"] }
termux-language-server = { command = "termux-language-server" }

[language-server.rust-analyzer.config.check]
command = "clippy"

[language-server.rust-analyzer.config.cargo]
features = "all"

# [language-server.pyright.config.python.analysis]
# typeCheckingMode = "basic"

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ruff.config.settings]
lineLength = 80
# args = ["--ignore", "E501"]

[language-server.ruff.config.settings.analyze]
detect-string-imports = true

[language-server.ruff.config.settings.lint]
# select = ["E4", "E7"]
preview = true

[language-server.ruff.config.settings.format]
preview = true
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# [language-server.basedpyright]
# command = "basedpyright-server"
# args = ['--stdio']

[language-server.basedpyright.config]
basedpyright.analysis.autoImportCompletions = true
basedpyright.analysis.autoSearchPaths = true
basedpyright.analysis.diagnosticMode = "workspace"
basedpyright.analysis.useTypingExtensions = true
basedpyright.analysis.useLibraryCodeForTypes = true

[language-server.typescript-language-server.config.preferences]
importModuleSpecifier = "non-relative"

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.eslint.config]
# runtime = "node"
# nodePath = "~/node_modules"
validate = "on"
run = "onType"
experimental = { useFlatConfig = true }
format.enable = false
codeActionOnSave.enable = false
rulesCustomizations = [{ rule = "*", severity = "warn" }]
# codeAction.disableRuleComment = { enable = true, location = "separateLine" }
# codeAction.showDocumentation.enable = true
# problems = { shortenToSingleLine = true }

[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
max_completion_items = 100           # set max completion results len for each group: words, snippets, unicode-input
feature_words = true                 # enable completion by word
feature_snippets = true              # enable snippets
snippets_first = false               # completions will return before snippets by default
snippets_inline_by_word_tail = false # suggest snippets by WORD tail, for example text `xsq|` become `x^2|` when snippet `sq` has body `^2`
feature_unicode_input = false        # enable "unicode input"
feature_paths = false                # enable path completion
feature_citations = false            # enable citation completion (only on `citation` feature enabled)

# write logs to /tmp/completion.log
# [language-server.scls.environment]
# RUST_LOG = "info,simple-completion-langauge-server=info"
# LOG_FILE = "/tmp/completion.log"

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]

[language-server.deno-lsp.config.deno]
enable = true
unstable = true
suggest.imports.hosts = { "https://deno.land" = true }
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.enumMemberValues.enabled = true

[language-server.cspell]
command = "cspell-lsp"
args = [
  "--stdio",
  "--config",
  "~/node_modules/@cspell/dict-en_us/cspell-ext.json",
]

[language-server.ltex]
command = "ltex-ls" # This one is too noisy, can be used in the markdown and stub

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

# Update / introduce languages
[[language]]
name = "rust"
# formatter = { command = "bash", args = ["-c", "rustfmt"] }
auto-format = true
language-servers = ["rust-analyzer", "scls"]

[[language]]
name = "wgsl"
formatter = { command = "wgslfmt" }

[[language]]
name = "toml"
auto-format = true
language-servers = ["taplo", "cspell", "scls"]
formatter = { command = "taplo", args = ["fmt", "-"] }

[[language]]
name = "yaml"
auto-format = true
formatter = { command = "npx", args = ["prettier", "--parser", "yaml"] }
file-types = ["yaml", "yml"]

# Python setup
[[language]]
name = "python"
auto-format = true
indent = { tab-width = 2, unit = "  " }
roots = ["pyproject.toml", "pyrightconfig.json", "Poetry.lock"]
language-servers = ["basedpyright", "ruff"]
formatter = { command = "ruff", args = ["format", "-"] }
# formatter = { command = "black", args = [
#   "--line-length",
#   "88",
#   "--quiet",
#   "-",
# ] }

# WEB languages
[[language]]
name = "html"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "html"] }
roots = [".git"]

[[language]]
name = "css"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "css"] }

# JS/TS family config
[[language]]
name = "javascript"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  { name = "eslint", except-features = ["format"] },
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "typescript"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  { name = "eslint", except-features = ["format"] },
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "tsx"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  "eslint",
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "jsx"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  "eslint",
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "json"
auto-format = true
language-servers = [
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },
  "biome",
]
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "jsonnet"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "nu"
auto-format = true
language-servers = ["nu-lsp"]

[[language]]
name = "markdown"
auto-format = true
# formatter = { command = "prettier", args = ["--parser", "markdown"] }
formatter = { command = 'deno', args = ["fmt", "-", "--ext", "md"] }
language-servers = [
  "marksman",
  "markdown-oxide",
  # "lsp-ai",
  "cspell",
  "scls",
  "harper-ls",
]

[[language]]
name = "bash"
auto-format = true
formatter = { command = "shfmt", args = ["-s", "-i", "2", "-sr", "-bn"] }

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-"] }

# [[language]]
# name = "ebuild"
# file-types = ["ebuild", "eclass", "make.conf", "color.map"]
# auto-format = true
# comment-tokens = "#"
# indent = { tab-width = 2, unit = "\t" }
# language-servers = ["termux-language-server"]
# scope = "source.ebuild"
# grammar = "bash"

[[language]]
name = "c"
auto-format = true
formatter = { command = "clang-format", args = ["--fallback-style=LLVM"] }

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format" }

# introduce a new language to enable completion on any doc by forcing set language with :set-language stub
[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = ["scls", "cspell"]

[[language]]
name = "git-commit"
language-servers = ["scls", "cspell"]


