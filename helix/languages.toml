[[language]]
name = "git-commit"
language-servers = ["scls"]

[[language]]
name = "c"
auto-format = true
formatter = { command = "clang-format", args = ["--falback-style=LLVM"] }

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format" }

# introduce a new language to enable completion on any doc by forcing set language with :set-language stub
[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = ["scls"]
