[[language]]
name = "toml"
auto-format = true
language-servers = ["taplo"]
formatter = { command = "taplo", args = ["fmt", "-"] }

[[language]]
name = "yaml"
auto-format = true
formatter = { command = "npx", args = ["prettier", "--parser", "yaml"] }
file-types = ["yaml", "yml"]

# Python setup
[[language]]
name = "python"
auto-format = true
indent = { tab-width = 4, unit = " " }
roots = ["pyproject.toml", "pyrightconfig.json", "Poetry.lock"]
language-servers = ["pyright", "ruff"]
formatter = { command = "black", args = [
  "--line-length",
  "88",
  "--quiet",
  "-",
] }

# WEB languages
[[language]]
name = "html"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "html"] }
roots = [".git"]

[[language]]
name = "css"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "css"] }

# JS/TS family config
[[language]]
name = "javascript"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  "eslint",
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "typescript"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  "eslint",
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "tsx"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  "eslint",
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "jsx"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome",
  "eslint",
  # "deno-lsp",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "json"
auto-format = true
language-servers = [
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },
  "biome",
]
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "jsonnet"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "nu"
auto-format = true
language-servers = ["nu-lsp"]

[[language]]
name = "markdown"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "markdown"] }

[[language]]
name = "bash"
auto-format = true
formatter = { command = "shfmt", args = ["-w", "-s", "-i", "2", "-sr", "-bn"] }

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-"] }

